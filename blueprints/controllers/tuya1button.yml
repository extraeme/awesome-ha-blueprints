blueprint:
  name: ZHA - TS0041 Attribute Switch (Fixed)
  description: Automate your Tuya Switch using ZHA Attribute Updated events.
  domain: automation
  input:
    tuya_1button_scene_switch:
      name: TS0041 Switch
      description: Select your Tuya button
      selector:
        device:
          integration: zha
    button_short_press:
      name: Short Press
      description: Action to run when the button is clicked
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_attribute_updated
    event_data:
      device_id: !input tuya_1button_scene_switch
      attribute_name: on_off

action:
  - sequence: !input button_short_press
