blueprint:
  name: ZHA - TS0041 Scene Switch (Template Matching Fix)
  description: Universal blueprint that evaluates the raw ZHA event payload to fix unresponsive triggers.
  domain: automation
  input:
    tuya_1button_scene_switch:
      name: TS0041 Switch
      description: Select your Tuya button
      selector:
        device:
          integration: zha
    button_short_press:
      name: Short Press
      description: Action to run on a short Press
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_1button_scene_switch

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ 'short' in trigger.event.data.command | lower or 
                 'short' in trigger.event.data.args | string | lower or
                 trigger.event.data.command == 'remote_button_short_press' }}
        sequence: !input button_short_press
