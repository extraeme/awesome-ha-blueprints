blueprint:
  name: ZHA - Sonoff/eWeLink Button Native Map
  description: Automate your eWeLink/Sonoff button using native quirk event clusters.
  domain: automation
  input:
    button_device:
      name: Button Device
      description: Select your eWeLink/Sonoff Button device
      selector:
        device:
          integration: zha
    short_press:
      name: Single Click (Toggle Command)
      default: []
      selector:
        action: {}
    double_press:
      name: Double Click (On Command)
      default: []
      selector:
        action: {}
    long_press:
      name: Long Press / Hold (Off Command)
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input button_device

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'toggle' }}"
        sequence: !input short_press
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'on' }}"
        sequence: !input double_press
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'off' }}"
        sequence: !input long_press
