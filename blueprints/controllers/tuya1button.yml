blueprint:
  name: ZHA - eWeLink Alternating Button (Absolute Fix)
  description: Explicitly triggers on consecutive True and False alternating state clicks.
  domain: automation
  input:
    ewelink_switch:
      name: eWeLink Switch
      description: Select your eWeLink button device
      selector:
        device:
          integration: zha
          manufacturer: eWeLink
          model: CK-TLSR8656-SS5-01(7000)
    button_short_press:
      name: Single Click Action
      description: Action to run on every single click (regardless of True/False state)
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_attribute_updated
    event_data:
      device_id: !input ewelink_switch
      attribute_name: on_off

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.attribute_value in [True, False] }}"
        sequence: !input button_short_press
