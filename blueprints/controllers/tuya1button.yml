blueprint:
  name: ZHA - eWeLink 1-Button Scene Switch (Verified Fix)
  description: Automate your eWeLink CK-TLSR8656-SS5-01(7000) Button using ZHA events.
  domain: automation
  input:
    ewelink_switch:
      name: eWeLink Switch
      description: Select your eWeLink button device
      selector:
        device:
          integration: zha
          manufacturer: eWeLink
          model: CK-TLSR8656-SS5-01(7000)
    button_short_press:
      name: Short Press
      description: Action to run on a short Press
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input ewelink_switch

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.event.data.command == 'remote_button_short_press' }}"
        sequence: !input button_short_press
