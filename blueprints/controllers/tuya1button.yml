blueprint:
  name: ZHA - eWeLink Single Button (State Override Fix)
  description: Triggers cleanly on any state transition from the button entity to bypass duplicate ZHA events.
  domain: automation
  input:
    ewelink_switch_entity:
      name: Button Switch Entity
      description: Select the 'switch' or 'sensor' entity for your eWeLink button (e.g., switch.ewelink_button)
      selector:
        entity:
          domain: [switch, sensor, binary_sensor]
    button_click:
      name: Button Action
      description: Action to run whenever the button is pressed (like light toggle)
      default: []
      selector:
        action: {}

mode: single

trigger:
  - platform: state
    entity_id: !input ewelink_switch_entity

action:
  - sequence: !input button_click
