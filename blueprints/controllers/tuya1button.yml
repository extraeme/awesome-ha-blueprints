blueprint:
  name: ZHA - TS0041 Scene Switch (Verified Click Fix)
  description: Automate your Tuya 1-Button Scene Switch using the verified Remote Button Short Press ZHA event.
  domain: automation
  input:
    tuya_1button_scene_switch:
      name: TS0041 Switch
      description: Select your Tuya button
      selector:
        device:
          integration: zha
    button_short_press:
      name: Short Press
      description: Action to run on a short Press
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input tuya_1button_scene_switch
      command: remote_button_short_press

action:
  - sequence: !input button_short_press
