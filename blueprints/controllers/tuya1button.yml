blueprint:
  name: ZHA - eWeLink Dual-Event Button Fix
  description: Handles dual-firing eWeLink button events cleanly by catching both variants while preventing execution race conditions.
  domain: automation
  input:
    ewelink_switch:
      name: eWeLink Switch
      description: Select your eWeLink button device
      selector:
        device:
          integration: zha
          manufacturer: eWeLink
          model: CK-TLSR8656-SS5-01(7000)
    button_click:
      name: Button Click Action
      description: Action to run when the button is pressed
      default: []
      selector:
        action: {}

mode: single

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input ewelink_switch
  - platform: event
    event_type: zha_attribute_updated
    event_data:
      device_id: !input ewelink_switch

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.command == 'remote_button_short_press' or
                 trigger.event.data.attribute_name == 'on_off' }}
        sequence: !input button_click
